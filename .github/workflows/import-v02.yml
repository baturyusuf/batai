name: import-v02

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import Batai v0.2 source patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .batai-v02.ready ]; then
            echo "v0.2 patch not ready; nothing to import."
            exit 0
          fi
          cat .batai-v02.part.* > /tmp/batai-v02.tar.gz.b64
          base64 -d /tmp/batai-v02.tar.gz.b64 | tar -xzf - -C .
          rm -f .batai-v02.ready .batai-v02.part.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: evolve Batai into v0.2 developer organization runtime"
          git push origin HEAD:main
